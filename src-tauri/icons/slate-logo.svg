<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Slate-Logo: drei gestapelte, schräge Schieferplatten (= Aufgabenkarten) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="230" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <g transform="translate(512 512) skewX(-14) translate(-512 -512)">
    <rect x="318" y="262" width="470" height="128" rx="40" fill="#ffffff"/>
    <rect x="246" y="448" width="470" height="128" rx="40" fill="#ffffff" fill-opacity="0.66"/>
    <rect x="318" y="634" width="470" height="128" rx="40" fill="#ffffff" fill-opacity="0.34"/>
  </g>
</svg>
